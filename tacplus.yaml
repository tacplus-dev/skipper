kind: service
# The compiler line this repository builds with: tacplus's current line, 2.6. tacplus.lock pins its exact
# release and build image by digest (`tacplus pin` moves it, in a commit; a build never does).
tacplus: "2.6"
language: rust
# Rust takes only pkg's last segment: the crate is skipper-model (Cargo.toml).
pkg: com.github.tacplusdev.skipper
output-dir: target/generated-sources
# The advisor reaches its model only through llmproxy, over S2S (#5); its contract comes through the registry.
# The Skipper's stream to its Admiral (#3): the Admiral's declared API (tacplus-dev/admiral#3), through the registry.
depends:
  - llmproxy
  - admiral
src: proto
